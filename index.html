<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MerchMagic | Coming Soon</title>
    <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/three@0.132.2/build/three.min.js"></script>
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }
        
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        .countdown-item {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .email-input:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(147, 51, 234, 0.5);
        }
        
        .category-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        
        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            background: rgba(255, 255, 255, 0.25);
        }
        
        .glow-text {
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.7);
        }
        
        .content-wrapper {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        
        .float-animation {
            animation: float 4s ease-in-out infinite;
        }
        
        .float-animation-delay-1 {
            animation-delay: 1s;
        }
        
        .float-animation-delay-2 {
            animation-delay: 2s;
        }
        
        .float-animation-delay-3 {
            animation-delay: 3s;
        }
    </style>
</head>
<body class="text-white">
    <!-- Three.js background canvas -->
    <div id="canvas-container"></div>

    <div class="min-h-screen flex flex-col items-center justify-center px-4 py-12 relative z-10">
        <!-- Logo Section -->
        <div class="mb-8 text-center">
            <h1 class="text-5xl md:text-7xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-500 to-pink-500 glow-text">MerchMagic</h1>
            <p class="text-xl mt-2 text-purple-200">Your One-Stop Shop for Custom Merchandise</p>
        </div>

        <!-- Main Content -->
        <div class="max-w-4xl mx-auto text-center mb-12 content-wrapper p-8 md:p-10">
            <h2 class="text-3xl md:text-4xl font-semibold text-white mb-6 glow-text">
                Something Awesome is Coming Soon
            </h2>
            <p class="text-lg text-purple-200 mb-8">
                We're crafting a unique collection of apparel, mugs, tote bags, and stationery items just for you.
            </p>

            <!-- Countdown Timer -->
            <div class="flex flex-wrap justify-center gap-4 mb-12">
                <div class="countdown-item w-20 h-20 rounded-lg flex flex-col items-center justify-center float-animation" id="days">
                    <span class="text-2xl font-bold text-purple-300">00</span>
                    <span class="text-sm text-purple-200">Days</span>
                </div>
                <div class="countdown-item w-20 h-20 rounded-lg flex flex-col items-center justify-center float-animation float-animation-delay-1" id="hours">
                    <span class="text-2xl font-bold text-purple-300">00</span>
                    <span class="text-sm text-purple-200">Hours</span>
                </div>
                <div class="countdown-item w-20 h-20 rounded-lg flex flex-col items-center justify-center float-animation float-animation-delay-2" id="minutes">
                    <span class="text-2xl font-bold text-purple-300">00</span>
                    <span class="text-sm text-purple-200">Minutes</span>
                </div>
                <div class="countdown-item w-20 h-20 rounded-lg flex flex-col items-center justify-center float-animation float-animation-delay-3" id="seconds">
                    <span class="text-2xl font-bold text-purple-300">00</span>
                    <span class="text-sm text-purple-200">Seconds</span>
                </div>
            </div>

            <!-- Newsletter Signup -->
            <div class="max-w-md mx-auto">
                <h3 class="text-xl font-semibold mb-4 text-purple-300">Get Notified When We Launch</h3>
                <form id="newsletter-form" class="flex flex-col sm:flex-row gap-2">
                    <input type="email" placeholder="Enter your email" class="email-input flex-1 px-4 py-2 rounded-lg border border-purple-400 focus:border-purple-500 transition-colors bg-transparent text-white" required>
                    <button type="submit" class="bg-gradient-to-r from-purple-600 to-pink-500 text-white px-6 py-2 rounded-lg hover:opacity-90 transition-opacity font-semibold">
                        Notify Me
                    </button>
                </form>
            </div>
        </div>

        <!-- Preview Categories -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-6 max-w-4xl mx-auto mb-12">
            <div class="category-card p-5 rounded-lg text-center float-animation">
                <i class="bi bi-person-wearing-dress text-4xl text-purple-300"></i>
                <p class="mt-3 font-medium text-purple-200">Apparel</p>
            </div>
            <div class="category-card p-5 rounded-lg text-center float-animation float-animation-delay-1">
                <i class="bi bi-cup-hot text-4xl text-purple-300"></i>
                <p class="mt-3 font-medium text-purple-200">Mugs</p>
            </div>
            <div class="category-card p-5 rounded-lg text-center float-animation float-animation-delay-2">
                <i class="bi bi-bag text-4xl text-purple-300"></i>
                <p class="mt-3 font-medium text-purple-200">Tote Bags</p>
            </div>
            <div class="category-card p-5 rounded-lg text-center float-animation float-animation-delay-3">
                <i class="bi bi-pencil text-4xl text-purple-300"></i>
                <p class="mt-3 font-medium text-purple-200">Stationery</p>
            </div>
        </div>

        <!-- Social Links -->
        <div class="flex gap-6 mb-6">
            <a href="#" class="text-purple-300 hover:text-white transition-colors transform hover:scale-110">
                <i class="bi bi-instagram text-3xl"></i>
            </a>
            <a href="#" class="text-purple-300 hover:text-white transition-colors transform hover:scale-110">
                <i class="bi bi-facebook text-3xl"></i>
            </a>
            <a href="#" class="text-purple-300 hover:text-white transition-colors transform hover:scale-110">
                <i class="bi bi-twitter text-3xl"></i>
            </a>
        </div>
    </div>

    <script>
        // Three.js background setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);
        
        // Create a gradient background effect
        const uniforms = {
            time: { value: 1.0 },
            resolution: { value: new THREE.Vector2() }
        };
        
        const material = new THREE.ShaderMaterial({
            uniforms: uniforms,
            vertexShader: `
                void main() {
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float time;
                uniform vec2 resolution;
                
                void main() {
                    vec2 position = gl_FragCoord.xy / resolution.xy;
                    
                    float color1 = sin(time * 0.2) * 0.5 + 0.5;
                    float color2 = cos(time * 0.1) * 0.5 + 0.5;
                    
                    vec3 color = mix(
                        vec3(0.05, 0.0, 0.1),  // Dark purple
                        vec3(0.3, 0.0, 0.4),   // Brighter purple
                        sin(position.x * 6.0 + time * 0.4) * 0.5 + 0.5
                    );
                    
                    // Add some animated waves
                    float wave = sin((position.x * 10.0) + time) * sin((position.y * 10.0) + time) * 0.25;
                    color += vec3(wave * 0.1, wave * 0.05, wave * 0.2);
                    
                    gl_FragColor = vec4(color, 1.0);
                }
            `
        });
        
        const plane = new THREE.PlaneGeometry(2, 2);
        const quad = new THREE.Mesh(plane, material);
        scene.add(quad);
        
        camera.position.z = 1;
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            uniforms.resolution.value.x = renderer.domElement.width;
            uniforms.resolution.value.y = renderer.domElement.height;
        }
        
        window.addEventListener('resize', onWindowResize);
        onWindowResize();
        
        function animate() {
            requestAnimationFrame(animate);
            uniforms.time.value += 0.01;
            renderer.render(scene, camera);
        }
        
        animate();

        // Set the launch date (30 days from now)
        const launchDate = new Date();
        launchDate.setDate(launchDate.getDate() + 30);

        // Update countdown every second
        function updateCountdown() {
            const now = new Date().getTime();
            const distance = launchDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.querySelector('#days span:first-child').textContent = days.toString().padStart(2, '0');
            document.querySelector('#hours span:first-child').textContent = hours.toString().padStart(2, '0');
            document.querySelector('#minutes span:first-child').textContent = minutes.toString().padStart(2, '0');
            document.querySelector('#seconds span:first-child').textContent = seconds.toString().padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        // Newsletter form submission
        document.getElementById('newsletter-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = this.querySelector('input[type="email"]').value;
            alert(`Thank you! We'll notify ${email} when we launch.`);
            this.reset();
        });
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
